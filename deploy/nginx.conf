# Configuración nginx para comunicalo.mx (sitio estático en /var/www/comunicalo/dist)
server {
    listen 80;
    server_name comunicalo.mx www.comunicalo.mx;
    return 301 https://comunicalo.mx$request_uri;
}

server {
    listen 443 ssl http2;
    server_name comunicalo.mx www.comunicalo.mx;
    # ssl_certificate     /etc/letsencrypt/live/comunicalo.mx/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/comunicalo.mx/privkey.pem;

    if ($host = www.comunicalo.mx) { return 301 https://comunicalo.mx$request_uri; }

    root /var/www/comunicalo/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Redirecciones 301 del sitio anterior (conserva posicionamiento en Google)
    location = /index.php {
        if ($arg_accion = "Internet-Empresarial")   { return 301 /empresas#internet-dedicado; }
        if ($arg_accion = "Internet-Eventos")       { return 301 /eventos; }
        if ($arg_accion = "Telefonia-IP")           { return 301 /empresas#telefonia-ip; }
        if ($arg_accion = "Servicios-LAN-to-LAN")   { return 301 /empresas#lan-to-lan; }
        if ($arg_accion = "Servicios-VPN")          { return 301 /empresas#vpn; }
        if ($arg_accion = "Redes-y-Wifi")           { return 301 /empresas#redes-wifi; }
        if ($arg_accion = "Servidores-Data-Center") { return 301 /empresas#data-center; }
        if ($arg_accion = "Productos-y-Servicios")  { return 301 /empresas; }
        if ($arg_accion ~ "^(Contacto|Atencion-clientes|Escalacion|EscalacionR)$") { return 301 /contacto; }
        if ($arg_accion != "") { return 301 /transparencia; }
        return 301 /;
    }
    location ~ ^/(Contacto|Internet-Empresarial|Internet-Eventos|Redes-y-Wifi|Servicios-LAN-to-LAN|Servicios-VPN|Servidores-Data-Center)\.html$ { return 301 /; }
    location ^~ /MCR/ { return 301 /cobertura; }
    location ~ ^/(OTE|TB)/?$ { return 301 /transparencia; }

    # Archivos con hash: caché larga
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /docs/   { expires 30d; }

    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
}
